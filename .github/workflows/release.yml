name: Release

# A tag is the entire release ritual: the CI triple runs, then publish with
# provenance (trusted publishing / OIDC – no npm token exists), then the
# GitHub Release. Configure the trusted publisher on the npm package before
# the first tagged release (see CONTRIBUTING.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance via trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"
      # Node 22 bundles npm 10.x; trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npx --no-install biome ci .
      - run: npm test
      # Publish the exact tarball that was just installed and executed – local
      # pack, the CI tarball job and the registry artifact are the same bytes
      # (0.1.0-0.1.20 each shipped a package that could not run).
      - run: npm pack --pack-destination "${{ runner.temp }}"
      - run: npm install --prefix "${{ runner.temp }}/smoke" "${{ runner.temp }}"/subtrk-*.tgz --no-fund --no-audit
      - run: node "${{ runner.temp }}/smoke/node_modules/subtrk/dist/cli.js" --version
      - run: test -f "${{ runner.temp }}/smoke/node_modules/subtrk/dist/console.html"
      - run: npm publish "${{ runner.temp }}"/subtrk-*.tgz --provenance
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
